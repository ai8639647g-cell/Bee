<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สมัครบัญชี</title>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            135deg,
            #020617,
            #172554,
            #2563eb
        );

    color:white;
}

.card{
    width:92%;
    max-width:420px;
    padding:30px;

    border-radius:24px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    margin:0;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin:10px 0 25px;
}

label{
    display:block;
    margin-top:17px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:15px;

    border:0;
    outline:0;

    border-radius:12px;

    font-size:16px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;

    border:0;
    border-radius:12px;

    background:#22c55e;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:wait;
}

#status{
    display:none;

    margin-top:20px;

    text-align:center;

    line-height:1.6;
}

.success{
    color:#86efac;
}

.error{
    color:#fca5a5;
}

.small{
    margin-top:18px;

    text-align:center;

    font-size:12px;

    color:#94a3b8;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🚀</div>

    <h1>สมัครบัญชี</h1>

    <div class="subtitle">
        กรอกอีเมลและรหัสผ่านเพื่อเข้าสู่เว็บไซต์
    </div>


    <form id="registerForm">

        <label for="email">
            อีเมล
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
        >


        <label for="password">
            รหัสผ่าน
        </label>

        <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="อย่างน้อย 6 ตัวอักษร"
            minlength="6"
            required
        >


        <label for="confirmPassword">
            ยืนยันรหัสผ่าน
        </label>

        <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="กรอกรหัสผ่านอีกครั้ง"
            minlength="6"
            required
        >


        <button
            id="registerButton"
            type="submit"
        >
            กำหนด
        </button>

    </form>


    <div id="status"></div>


    <div class="small">
        ระบบรักษารหัสผ่านผ่าน Supabase Auth
    </div>

</div>


<script>

/* =====================================================
   1. SUPABASE CONFIG
   =====================================================

   ใส่ข้อมูลของ Supabase Project คุณตรงนี้
   ===================================================== */

const SUPABASE_URL =
    "ใส่_SUPABASE_PROJECT_URL_ตรงนี้";

const SUPABASE_PUBLISHABLE_KEY =
    "ใส่_SUPABASE_PUBLISHABLE_KEY_ตรงนี้";


/* =====================================================
   2. เว็บหลักของคุณ
   ===================================================== */

const MAIN_WEBSITE =
    "https://ai8639647g-cell.github.io/GGB/";


/* =====================================================
   3. สร้าง Supabase Client
   ===================================================== */

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   4. แสดงข้อความ
   ===================================================== */

function showStatus(message, type){

    const status =
        document.getElementById("status");

    status.innerHTML = message;

    status.className = type;

    status.style.display = "block";
}


/* =====================================================
   5. สมัครบัญชี
   ===================================================== */

document
.getElementById("registerForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const button =
            document
            .getElementById("registerButton");


        /* ---------------------------------------------
           ตรวจสอบรหัสผ่าน
           --------------------------------------------- */

        if(password.length < 6){

            showStatus(
                "❌ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",
                "error"
            );

            return;
        }


        if(password !== confirmPassword){

            showStatus(
                "❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน",
                "error"
            );

            return;
        }


        /* ---------------------------------------------
           ป้องกันการกดซ้ำ
           --------------------------------------------- */

        button.disabled = true;

        button.textContent =
            "กำลังสมัคร...";


        try{

            /* =========================================
               สร้างบัญชีผ่าน Supabase Auth
               ========================================= */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password

            });


            /* =========================================
               ถ้า Supabase แจ้ง error
               ========================================= */

            if(error){

                throw error;
            }


            const user =
                data.user;


            const session =
                data.session;


            if(!user){

                throw new Error(
                    "ไม่สามารถสร้างบัญชีได้"
                );
            }


            /* =========================================
               ถ้ายังต้องยืนยันอีเมล
               ========================================= */

            if(!session){

                showStatus(
                    "✅ สร้างบัญชีแล้ว<br><br>" +
                    "กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี",
                    "success"
                );

                button.disabled = false;

                button.textContent =
                    "กำหนด";

                return;
            }


            /* =========================================
               บันทึกกิจกรรมลงฐานข้อมูล
               =========================================

               ไม่ส่ง password เข้า database
               ========================================= */

            const {
                error: logError
            } =
            await supabaseClient
            .from("activity_logs")
            .insert({

                user_id:
                    user.id,

                event_type:
                    "register",

                page:
                    "register.html",

                details: {

                    message:
                        "สร้างบัญชีสำเร็จ",

                    email:
                        email

                }

            });


            /* -----------------------------------------
               ถ้าบันทึกกิจกรรมไม่ได้
               ----------------------------------------- */

            if(logError){

                console.error(
                    "Activity log error:",
                    logError
                );

                /*
                 * ไม่ยกเลิกการสมัคร
                 * เพราะบัญชีสร้างสำเร็จแล้ว
                 */
            }


            /* =========================================
               สำเร็จ
               ========================================= */

            showStatus(
                "✅ สมัครบัญชีสำเร็จ<br>" +
                "กำลังเข้าสู่เว็บไซต์...",
                "success"
            );


            /* =========================================
               เด้งเข้าเว็บหลัก
               ========================================= */

            setTimeout(
                function(){

                    window.location.replace(
                        MAIN_WEBSITE
                    );

                },
                500
            );

        }

        catch(error){

            console.error(error);


            let message =
                error.message ||
                "เกิดข้อผิดพลาด";


            /* -----------------------------------------
               แปลงข้อความบางกรณีให้อ่านง่าย
               ----------------------------------------- */

            if(
                message
                .toLowerCase()
                .includes("already registered")
            ){

                message =
                    "อีเมลนี้มีบัญชีอยู่แล้ว";
            }


            showStatus(
                "❌ " + message,
                "error"
            );


            button.disabled = false;

            button.textContent =
                "กำหนด";
        }

    }
);

</script>

</body>
</html>
