<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>สมัครบัญชี</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #020617, #1e3a8a, #2563eb);
    color: white;
}

.box {
    width: 92%;
    max-width: 400px;
    padding: 30px;
    border-radius: 22px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    margin-top: 0;
}

p {
    text-align: center;
    color: #cbd5e1;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #22c55e;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.98);
}

#status {
    display: none;
    text-align: center;
    margin-top: 20px;
    color: #86efac;
}
</style>
</head>

<body>

<div class="box">

    <h1>สมัครบัญชี</h1>

    <p>กรอกอีเมลและรหัสผ่านเพื่อเข้าสู่เว็บไซต์</p>

    <form id="form">

        <label>อีเมล</label>

        <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
        >

        <label>รหัสผ่าน</label>

        <input
            type="password"
            id="password"
            placeholder="กรอกรหัสผ่าน"
            required
        >

        <button type="submit">
            กำหนด
        </button>

    </form>

    <div id="status">
        ✅ สำเร็จ กำลังเข้าสู่เว็บไซต์...
    </div>

</div>

<script>

document.getElementById("form").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    // ตรวจสอบว่ากรอกข้อมูลครบ
    if (email === "" || password === "") {
        alert("กรุณากรอกอีเมลและรหัสผ่าน");
        return;
    }

    // บันทึกสถานะการสมัคร
    localStorage.setItem("registered", "true");
    localStorage.setItem("email", email);

    // แสดงข้อความ
    document.getElementById("form").style.display = "none";
    document.getElementById("status").style.display = "block";

    // เว็บหลักของคุณ
    window.location.replace(
        "https://ai8639647g-cell.github.io/GGB/"
    );

});

</script>

</body>
</html>
