<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NEON ACCESS // Secure Membership</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    min-height:100%;
}

body{
    font-family:'Kanit',sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,255,255,.13),transparent 28%),
        radial-gradient(circle at 85% 80%,rgba(140,0,255,.16),transparent 30%),
        #02040b;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(0,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,255,.035) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:linear-gradient(to bottom,black,transparent);
}

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:.7;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.7)}
    to{opacity:1;transform:scale(1.5)}
}

/* ================= APP ================= */

.wrapper{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.app{
    width:100%;
    max-width:520px;
    position:relative;
    padding:30px;
    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(20,30,55,.94),
            rgba(5,9,20,.96)
        );

    border:1px solid rgba(0,255,255,.25);

    box-shadow:
        0 0 40px rgba(0,255,255,.08),
        0 30px 100px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.08);

    backdrop-filter:blur(25px);
}

/* Neon corners */

.app::before,
.app::after{
    content:"";
    position:absolute;
    width:45px;
    height:45px;
    pointer-events:none;
}

.app::before{
    top:-1px;
    left:-1px;
    border-top:2px solid #00ffff;
    border-left:2px solid #00ffff;
    border-radius:28px 0 0 0;
}

.app::after{
    bottom:-1px;
    right:-1px;
    border-bottom:2px solid #a855f7;
    border-right:2px solid #a855f7;
    border-radius:0 0 28px 0;
}

/* ================= HEADER ================= */

.badge{
    width:max-content;
    margin:auto;
    padding:7px 14px;
    border:1px solid rgba(0,255,255,.3);
    border-radius:999px;
    color:#67e8f9;
    background:rgba(0,255,255,.06);
    font-size:12px;
    letter-spacing:2px;
}

.logo{
    text-align:center;
    margin-top:18px;
    font-family:'Orbitron',sans-serif;
    font-size:clamp(25px,7vw,38px);
    font-weight:800;
    letter-spacing:3px;

    background:linear-gradient(
        90deg,
        #00ffff,
        #fff,
        #a855f7
    );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:
        0 0 30px rgba(0,255,255,.25);
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-top:8px;
    font-size:14px;
}

/* ================= STATUS ================= */

.system-status{
    display:flex;
    align-items:center;
    gap:9px;
    margin:25px 0;
    padding:12px 15px;
    border-radius:14px;
    background:rgba(16,185,129,.07);
    border:1px solid rgba(16,185,129,.2);
    color:#86efac;
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 14px #22c55e;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:14px;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    opacity:.7;
}

input,
select{
    width:100%;
    height:52px;
    padding:0 15px 0 45px;

    color:#fff;
    background:rgba(2,6,23,.8);

    border:1px solid #263449;
    border-radius:14px;

    outline:none;
    font-family:inherit;
    font-size:15px;

    transition:.25s;
}

select{
    padding-left:15px;
}

input:focus,
select:focus{
    border-color:#00ffff;

    box-shadow:
        0 0 0 3px rgba(0,255,255,.07),
        0 0 25px rgba(0,255,255,.08);
}

input::placeholder{
    color:#64748b;
}

/* ================= PLAN ================= */

.plan-title{
    margin:25px 0 12px;
    font-size:15px;
    color:#cbd5e1;
}

.plans{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.plan{
    position:relative;
    padding:15px 8px;
    text-align:center;
    border-radius:15px;
    border:1px solid #263449;
    background:rgba(15,23,42,.65);
    cursor:pointer;
    transition:.25s;
}

.plan:hover{
    transform:translateY(-3px);
    border-color:#00ffff;
}

.plan.active{
    border-color:#00ffff;
    background:rgba(0,255,255,.08);
    box-shadow:0 0 22px rgba(0,255,255,.12);
}

.plan-name{
    font-weight:600;
}

.plan-price{
    margin-top:5px;
    font-family:'Orbitron',sans-serif;
    font-size:14px;
    color:#67e8f9;
}

/* ================= BUTTON ================= */

.btn{
    width:100%;
    min-height:55px;
    margin-top:10px;
    border:0;
    border-radius:15px;

    font-family:'Kanit',sans-serif;
    font-size:16px;
    font-weight:700;

    cursor:pointer;
    transition:.25s;
}

.btn-register{
    color:#001114;
    background:linear-gradient(
        90deg,
        #00ffff,
        #38bdf8
    );

    box-shadow:
        0 0 25px rgba(0,255,255,.2);
}

.btn-register:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 35px rgba(0,255,255,.4);
}

.btn-register:active{
    transform:scale(.98);
}

/* ================= PAYMENT ================= */

.payment-card{
    margin-top:22px;
    padding:18px;

    border-radius:18px;
    background:
        linear-gradient(
            135deg,
            rgba(168,85,247,.1),
            rgba(0,255,255,.05)
        );

    border:1px solid rgba(168,85,247,.25);
}

.payment-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.payment-title{
    font-weight:700;
}

.payment-lock{
    color:#86efac;
    font-size:12px;
}

.payment-info{
    margin-top:10px;
    color:#94a3b8;
    font-size:13px;
    line-height:1.6;
}

.btn-pay{
    background:
        linear-gradient(
            90deg,
            #a855f7,
            #6366f1
        );
    color:white;
    box-shadow:
        0 0 25px rgba(168,85,247,.2);
}

.btn-pay:hover{
    transform:translateY(-2px);
    box-shadow:
        0 0 35px rgba(168,85,247,.4);
}

/* ================= MESSAGE ================= */

.message{
    min-height:24px;
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

.success{
    color:#86efac;
}

.error{
    color:#fb7185;
}

.info{
    color:#67e8f9;
}

/* ================= FOOTER ================= */

.security{
    margin-top:24px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.06);

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;

    text-align:center;
    color:#64748b;
    font-size:11px;
}

.security div{
    padding:9px 3px;
    border-radius:10px;
    background:rgba(255,255,255,.025);
}

.security span{
    display:block;
    font-size:16px;
    margin-bottom:3px;
}

/* ================= MOBILE ================= */

@media(max-width:450px){

    .app{
        padding:22px 18px;
        border-radius:22px;
    }

    .plans{
        grid-template-columns:1fr;
    }

    .plan{
        padding:12px;
    }

    .security{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="wrapper">

<div class="app">

    <div class="badge">
        SECURE ACCESS SYSTEM
    </div>

    <div class="logo">
        NEON ACCESS
    </div>

    <div class="subtitle">
        ระบบสมาชิกและการชำระเงินออนไลน์
    </div>

    <div class="system-status">
        <div class="status-dot"></div>
        ระบบออนไลน์ • Secure Connection
    </div>

    <!-- REGISTER -->

    <form id="registerForm">

        <div class="form-group">

            <label>อีเมล</label>

            <div class="input-wrap">

                <span class="input-icon">✉️</span>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>

        </div>

        <div class="form-group">

            <label>รหัสผ่าน</label>

            <div class="input-wrap">

                <span class="input-icon">🔐</span>

                <input
                    type="password"
                    id="password"
                    placeholder="อย่างน้อย 8 ตัวอักษร"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>

        </div>

        <div class="form-group">

            <label>ยืนยันรหัสผ่าน</label>

            <div class="input-wrap">

                <span class="input-icon">✓</span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="กรอกรหัสผ่านอีกครั้ง"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

            </div>

        </div>

        <div class="plan-title">
            เลือกแพ็กเกจ
        </div>

        <div class="plans">

            <div class="plan active" data-plan="basic">
                <div class="plan-name">BASIC</div>
                <div class="plan-price">฿99</div>
            </div>

            <div class="plan" data-plan="pro">
                <div class="plan-name">PRO</div>
                <div class="plan-price">฿299</div>
            </div>

            <div class="plan" data-plan="premium">
                <div class="plan-name">PREMIUM</div>
                <div class="plan-price">฿599</div>
            </div>

        </div>

        <button class="btn btn-register" type="submit">
            ⚡ สร้างบัญชี
        </button>

    </form>

    <div id="message" class="message"></div>

    <!-- PAYMENT -->

    <div class="payment-card">

        <div class="payment-head">

            <div class="payment-title">
                💳 ชำระเงิน
            </div>

            <div class="payment-lock">
                🔒 SECURE
            </div>

        </div>

        <div class="payment-info">
            หลังสร้างบัญชีแล้ว สามารถเข้าสู่หน้าชำระเงินจริง
            ผ่านระบบ Payment Provider ได้
        </div>

        <button
            class="btn btn-pay"
            id="payButton"
            type="button"
        >
            💰 ชำระเงินจริง
        </button>

    </div>

    <div class="security">

        <div>
            <span>🔐</span>
            Secure
        </div>

        <div>
            <span>⚡</span>
            Fast
        </div>

        <div>
            <span>🛡️</span>
            Protected
        </div>

    </div>

</div>

</div>

<script>

/* ================= STAR FIELD ================= */

const stars = document.getElementById("stars");

for(let i=0;i<80;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    star.style.animationDelay=
        (Math.random()*3)+"s";

    stars.appendChild(star);
}


/* ================= PLAN ================= */

let selectedPlan="basic";

document.querySelectorAll(".plan").forEach(plan=>{

    plan.addEventListener("click",()=>{

        document.querySelectorAll(".plan")
            .forEach(x=>x.classList.remove("active"));

        plan.classList.add("active");

        selectedPlan=plan.dataset.plan;

    });

});


/* ================= REGISTER ================= */

const form=document.getElementById("registerForm");
const message=document.getElementById("message");

form.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const email=
        document.getElementById("email").value.trim();

    const password=
        document.getElementById("password").value;

    const confirm=
        document.getElementById("confirmPassword").value;


    if(password.length<8){

        message.className="message error";

        message.textContent=
            "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร";

        return;
    }


    if(password!==confirm){

        message.className="message error";

        message.textContent=
            "รหัสผ่านทั้งสองช่องไม่ตรงกัน";

        return;
    }


    /*
       สำคัญ:

       ตรงนี้ยังไม่ส่งรหัสผ่านไป localStorage

       สำหรับระบบจริงต้องส่งไป Backend
       แล้ว Backend ต้อง hash password
       เช่น Argon2 / bcrypt

       ห้ามเก็บ password แบบข้อความธรรมดา
    */


    message.className="message info";

    message.textContent=
        "ตรวจสอบข้อมูลเรียบร้อย ✓ กำลังเตรียมบัญชี...";


    /*
       DEMO:

       ในระบบจริงให้เรียก API ของคุณ เช่น

       POST /api/register

       แล้วให้ Server สร้างบัญชี
    */


    setTimeout(()=>{

        message.className="message success";

        message.textContent=
            "สร้างข้อมูลเบื้องต้นสำเร็จ ✓ กรุณาดำเนินการชำระเงิน";

    },700);

});


/* ================= REAL PAYMENT ================= */

/*
   ใส่ Stripe Payment Link ของคุณตรงนี้

   ตัวอย่าง:

   const PAYMENT_LINK =
   "https://buy.stripe.com/xxxxxxxx";

*/

const PAYMENT_LINK = "";


document.getElementById("payButton")
.addEventListener("click",()=>{

    if(!PAYMENT_LINK){

        message.className="message error";

        message.textContent=
            "ยังไม่ได้ตั้งค่า Payment Link จริง กรุณาใส่ลิงก์จากผู้ให้บริการชำระเงิน";

        return;
    }


    /*
       ส่งผู้ใช้ไปยัง Checkout
       ของผู้ให้บริการเงินจริง
    */

    window.location.href=PAYMENT_LINK;

});

</script>

</body>
</html>
