<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>GGB Account</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,#164b8c 0%,transparent 35%),
        radial-gradient(circle at 80% 80%,#4c167d 0%,transparent 35%),
        #050810;
    color:white;
}

.card{
    width:min(430px,92%);
    padding:30px;
    border-radius:28px;
    background:rgba(12,17,32,.9);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 80px rgba(0,0,0,.6);
    backdrop-filter:blur(20px);
}

.logo{
    width:72px;
    height:72px;
    margin:auto;
    margin-bottom:15px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:900;
    background:linear-gradient(135deg,#00c8ff,#645bff);
    box-shadow:0 0 35px rgba(0,190,255,.35);
}

h1{
    text-align:center;
    font-size:28px;
}

.subtitle{
    text-align:center;
    color:#9da8c0;
    font-size:14px;
    margin-top:8px;
    margin-bottom:25px;
}

.form{
    display:none;
}

.form.active{
    display:block;
}

label{
    display:block;
    margin:14px 0 7px;
    color:#cbd4e8;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border-radius:13px;
    border:1px solid #303951;
    outline:none;
    background:#080d1b;
    color:white;
    font-size:15px;
}

input:focus{
    border-color:#00c8ff;
    box-shadow:0 0 0 3px rgba(0,200,255,.1);
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#00bfff,#635bff);
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.link{
    text-align:center;
    color:#46d8ff;
    margin-top:17px;
    cursor:pointer;
    font-size:14px;
}

.link:hover{
    text-decoration:underline;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.message.error{
    color:#ff9da9;
    background:rgba(255,50,80,.1);
    border:1px solid rgba(255,50,80,.25);
}

.message.success{
    color:#71f5c3;
    background:rgba(0,220,150,.1);
    border:1px solid rgba(0,220,150,.25);
}

.spinner{
    display:inline-block;
    width:15px;
    height:15px;
    margin-right:7px;
    border:2px solid rgba(255,255,255,.35);
    border-top-color:white;
    border-radius:50%;
    animation:spin .7s linear infinite;
    vertical-align:middle;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.footer{
    text-align:center;
    color:#68738d;
    font-size:11px;
    margin-top:22px;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">
        GGB
    </div>

    <h1>GGB Account</h1>

    <div class="subtitle">
        บัญชีสำหรับเข้าสู่ระบบ GGB
    </div>


    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <div id="loginForm" class="form active">

        <label>
            อีเมล
        </label>

        <input
            id="loginEmail"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >

        <label>
            รหัสผ่าน
        </label>

        <input
            id="loginPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
        >

        <button
            id="loginBtn"
            onclick="login()"
        >
            เข้าสู่ระบบ
        </button>

        <div
            class="link"
            onclick="showForm('register')"
        >
            ยังไม่มีบัญชี? สมัครบัญชี
        </div>

        <div
            class="link"
            onclick="showForm('forgot')"
        >
            ลืมรหัสผ่าน?
        </div>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- REGISTER -->
    <!-- ========================= -->

    <div id="registerForm" class="form">

        <label>
            อีเมล
        </label>

        <input
            id="registerEmail"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >

        <label>
            รหัสผ่าน
        </label>

        <input
            id="registerPassword"
            type="password"
            placeholder="อย่างน้อย 6 ตัวอักษร"
            autocomplete="new-password"
        >

        <label>
            ยืนยันรหัสผ่าน
        </label>

        <input
            id="registerConfirm"
            type="password"
            placeholder="กรอกรหัสผ่านอีกครั้ง"
            autocomplete="new-password"
        >

        <button
            id="registerBtn"
            onclick="register()"
        >
            สมัครบัญชี
        </button>

        <div
            class="link"
            onclick="showForm('login')"
        >
            ← กลับเข้าสู่ระบบ
        </div>

        <div
            id="registerMessage"
            class="message"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- FORGOT PASSWORD -->
    <!-- ========================= -->

    <div id="forgotForm" class="form">

        <label>
            อีเมลของบัญชี
        </label>

        <input
            id="forgotEmail"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
        >

        <button
            id="forgotBtn"
            onclick="forgotPassword()"
        >
            ส่งลิงก์กู้คืนรหัสผ่าน
        </button>

        <div
            class="link"
            onclick="showForm('login')"
        >
            ← กลับเข้าสู่ระบบ
        </div>

        <div
            id="forgotMessage"
            class="message"
        ></div>

    </div>


    <div class="footer">
        GGB Secure Account System
    </div>

</div>


<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script type="module">

import { initializeApp }

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    createUserWithEmailAndPassword,

    signInWithEmailAndPassword,

    sendPasswordResetEmail,

    signOut

}

from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/*
=====================================================
🔥 FIREBASE CONFIG
=====================================================

ใส่ข้อมูล Firebase ของคุณตรงนี้

ตัวอย่าง:

const firebaseConfig = {

    apiKey: "AIza......",

    authDomain:
        "my-project.firebaseapp.com",

    projectId:
        "my-project",

    storageBucket:
        "my-project.firebasestorage.app",

    messagingSenderId:
        "123456789",

    appId:
        "1:123456789:web:abcdef"

};

=====================================================
*/


const firebaseConfig = {

    apiKey:
        "ใส่_API_KEY_ของคุณ",

    authDomain:
        "ใส่_PROJECT_ID.firebaseapp.com",

    projectId:
        "ใส่_PROJECT_ID",

    storageBucket:
        "ใส่_PROJECT_ID.firebasestorage.app",

    messagingSenderId:
        "ใส่_MESSAGING_SENDER_ID",

    appId:
        "ใส่_APP_ID"

};



/*
=====================================================
เริ่ม Firebase
=====================================================
*/

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);



/*
=====================================================
เว็บหลักของคุณ
=====================================================
*/

const MAIN_WEBSITE =
"https://ai8639647g-cell.github.io/GGB/?utm_source=chatgpt.com";



/*
=====================================================
เปลี่ยนหน้า
=====================================================
*/

window.showForm = function(name){

    document
        .querySelectorAll(".form")
        .forEach(function(form){

            form.classList.remove("active");

        });


    const target =
        document.getElementById(
            name + "Form"
        );


    if(target){

        target.classList.add("active");

    }


    clearMessages();

};



/*
=====================================================
ล้างข้อความ
=====================================================
*/

function clearMessages(){

    document
        .querySelectorAll(".message")
        .forEach(function(box){

            box.className = "message";

            box.textContent = "";

        });

}



/*
=====================================================
แสดงข้อความ
=====================================================
*/

function message(id,text,type){

    const box =
        document.getElementById(id);


    box.textContent = text;


    box.className =
        "message show " + type;

}



/*
=====================================================
สมัครบัญชี
=====================================================
*/

window.register = async function(){

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("registerPassword")
        .value;


    const confirm =
        document
        .getElementById("registerConfirm")
        .value;



    /*
    ตรวจสอบอีเมล
    */

    if(!email){

        message(
            "registerMessage",
            "กรุณากรอกอีเมล",
            "error"
        );

        return;

    }



    /*
    ตรวจสอบรหัสผ่าน
    */

    if(!password){

        message(
            "registerMessage",
            "กรุณากรอกรหัสผ่าน",
            "error"
        );

        return;

    }



    if(password.length < 6){

        message(
            "registerMessage",
            "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",
            "error"
        );

        return;

    }



    /*
    ตรวจสอบรหัสผ่านซ้ำ
    */

    if(password !== confirm){

        message(
            "registerMessage",
            "รหัสผ่านทั้งสองช่องไม่ตรงกัน",
            "error"
        );

        return;

    }



    const button =
        document
        .getElementById("registerBtn");


    button.disabled = true;


    button.innerHTML =
        '<span class="spinner"></span>กำลังสมัครบัญชี...';



    try{

        /*
        ============================================
        สร้างบัญชี Firebase
        ============================================
        */

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );



        /*
        ============================================
        สมัครสำเร็จ
        ============================================
        */

        console.log(
            "สร้างบัญชีสำเร็จ:",
            userCredential.user.uid
        );



        message(
            "registerMessage",
            "สมัครบัญชีสำเร็จ! กำลังเข้าสู่เว็บหลัก...",
            "success"
        );



        /*
        ============================================
        ⭐ เด้งเข้าเว็บหลักอัตโนมัติ
        ============================================
        */

        setTimeout(function(){

            window.location.replace(
                MAIN_WEBSITE
            );

        },500);



    }catch(error){

        console.error(error);


        message(
            "registerMessage",
            firebaseError(error.code),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "สมัครบัญชี";

    }

};



/*
=====================================================
LOGIN
=====================================================
*/

window.login = async function(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;



    if(!email){

        message(
            "loginMessage",
            "กรุณากรอกอีเมล",
            "error"
        );

        return;

    }



    if(!password){

        message(
            "loginMessage",
            "กรุณากรอกรหัสผ่าน",
            "error"
        );

        return;

    }



    const button =
        document
        .getElementById("loginBtn");


    button.disabled = true;


    button.innerHTML =
        '<span class="spinner"></span>กำลังเข้าสู่ระบบ...';



    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );



        message(
            "loginMessage",
            "เข้าสู่ระบบสำเร็จ! กำลังเปิดเว็บหลัก...",
            "success"
        );



        /*
        ⭐ LOGIN สำเร็จ
        ⭐ เด้งเข้าเว็บหลัก
        */

        setTimeout(function(){

            window.location.replace(
                MAIN_WEBSITE
            );

        },500);



    }catch(error){

        console.error(error);


        message(
            "loginMessage",
            firebaseError(error.code),
            "error"
        );


        button.disabled = false;

        button.textContent =
            "เข้าสู่ระบบ";

    }

};



/*
=====================================================
FORGOT PASSWORD
=====================================================
*/

window.forgotPassword = async function(){

    const email =
        document
        .getElementById("forgotEmail")
        .value
        .trim();



    if(!email){

        message(
            "forgotMessage",
            "กรุณากรอกอีเมล",
            "error"
        );

        return;

    }



    const button =
        document
        .getElementById("forgotBtn");


    button.disabled = true;


    button.innerHTML =
        '<span class="spinner"></span>กำลังส่ง...';



    try{

        await sendPasswordResetEmail(
            auth,
            email
        );



        message(
            "forgotMessage",
            "ส่งลิงก์กู้คืนไปยังอีเมลแล้ว กรุณาตรวจสอบกล่องจดหมาย",
            "success"
        );



    }catch(error){

        console.error(error);


        message(
            "forgotMessage",
            firebaseError(error.code),
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "ส่งลิงก์กู้คืนรหัสผ่าน";

    }

};



/*
=====================================================
LOGOUT
=====================================================
*/

window.logout = async function(){

    await signOut(auth);

    showForm("login");

};



/*
=====================================================
Firebase Error → ภาษาไทย
=====================================================
*/

function firebaseError(code){

    switch(code){

        case "auth/email-already-in-use":

            return "อีเมลนี้มีบัญชีอยู่แล้ว";


        case "auth/invalid-email":

            return "รูปแบบอีเมลไม่ถูกต้อง";


        case "auth/weak-password":

            return "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";


        case "auth/invalid-credential":

            return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";


        case "auth/user-not-found":

            return "ไม่พบบัญชีนี้";


        case "auth/wrong-password":

            return "รหัสผ่านไม่ถูกต้อง";


        case "auth/too-many-requests":

            return "มีการลองเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่";


        case "auth/network-request-failed":

            return "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้";


        case "auth/operation-not-allowed":

            return "Firebase ยังไม่ได้เปิด Email/Password Authentication";


        default:

            return "เกิดข้อผิดพลาด: " + code;

    }

}

</script>

</body>
</html>
