<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ระบบสมัครสมาชิกปลอดภัยสูง</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Orbitron:wght@500;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #0f172a 0%,
                    #020617 100%
                );

            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            margin: 0;

            user-select: none;

            overflow: hidden;

            position: relative;
        }


        /* ===============================
           MATRIX GRID
        =============================== */

        body::before {

            content: "";

            position: absolute;

            width: 200%;
            height: 200%;

            top: -50%;
            left: -50%;

            background-image:

                linear-gradient(
                    rgba(56, 189, 248, 0.03) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(56, 189, 248, 0.03) 1px,
                    transparent 1px
                );

            background-size: 30px 30px;

            animation:
                gridMove 20s linear infinite;

            z-index: 0;

            pointer-events: none;
        }


        @keyframes gridMove {

            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50px);
            }

        }


        /* ===============================
           MAIN CONTAINER
        =============================== */

        .app-container {

            background:

                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.97),
                    rgba(30, 41, 59, 0.97)
                );

            padding: 40px 30px;

            border-radius: 20px;

            box-shadow:

                0 20px 50px rgba(0, 0, 0, 0.7),

                0 0 20px
                rgba(56, 189, 248, 0.1);

            width: calc(100% - 30px);

            max-width: 440px;

            border:
                1px solid
                rgba(56, 189, 248, 0.2);

            position: relative;

            z-index: 1;

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);
        }


        /* TOP LIGHT */

        .app-container::after {

            content: "";

            position: absolute;

            top: 0;

            left: 10%;

            width: 80%;

            height: 2px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    #38bdf8,
                    #00ffcc,
                    transparent
                );

            box-shadow:
                0 0 10px #38bdf8;
        }


        /* ===============================
           TITLE
        =============================== */

        h2 {

            text-align: center;

            margin-top: 0;

            margin-bottom: 25px;

            color: #38bdf8;

            font-family:
                'Orbitron',
                'Noto Sans Thai',
                sans-serif;

            font-weight: 700;

            letter-spacing: 1px;

            text-shadow:
                0 0 10px
                rgba(56, 189, 248, 0.5);
        }


        /* ===============================
           FORM
        =============================== */

        .form-group {

            margin-bottom: 20px;

            position: relative;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #94a3b8;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 0.5px;
        }


        input {

            width: 100%;

            padding: 14px 16px;

            background-color:
                rgba(2, 6, 23, 0.7);

            border:
                1px solid
                #334155;

            border-radius: 10px;

            color: #ffffff;

            font-size: 15px;

            font-family: inherit;

            outline: none;
        }


        input::placeholder {

            color: #64748b;
        }


        input:focus {

            border-color: #38bdf8;

            box-shadow:
                0 0 15px
                rgba(56, 189, 248, 0.25);

            background-color:
                rgba(2, 6, 23, 0.9);
        }


        /* PIN */

        #pinInput {

            font-family:
                'Orbitron',
                monospace;

            letter-spacing: 4px;
        }


        /* ===============================
           SUBMIT BUTTON
        =============================== */

        .btn-submit {

            width: 100%;

            padding: 14px;

            background:

                linear-gradient(
                    135deg,
                    #3b82f6 0%,
                    #1d4ed8 100%
                );

            color: white;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-family: inherit;

            cursor: pointer;

            font-weight: bold;

            margin-top: 10px;

            box-shadow:
                0 4px 15px
                rgba(59, 130, 246, 0.3);
        }


        .btn-submit:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 6px 20px
                rgba(59, 130, 246, 0.5);
        }


        .btn-submit:active {

            transform:
                translateY(1px);
        }


        .btn-submit:disabled {

            cursor: not-allowed;

            opacity: 0.6;
        }


        /* ===============================
           STATUS
        =============================== */

        .status-msg {

            text-align: center;

            margin: 20px 0;

            font-size: 14px;

            min-height: 24px;

            font-weight: bold;

            padding: 8px;

            border-radius: 6px;
        }


        .status-msg.loading {

            color: #f59e0b;

            background:
                rgba(245, 158, 11, 0.1);

            animation:
                pulse 1s infinite alternate;
        }


        @keyframes pulse {

            0% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }

        }


        /* ===============================
           MAIN WEBSITE BUTTON
        =============================== */

        .btn-go-main {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            padding: 16px;

            background-color:
                #0f172a;

            color: #475569;

            text-align: center;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            border:
                2px dashed
                #334155;

            cursor: not-allowed;

            min-height: 58px;
        }


        /* ACTIVE BLUE BUTTON */

        .btn-go-main.active {

            background:

                linear-gradient(
                    135deg,
                    #00f2fe 0%,
                    #4facfe 100%
                );

            color: #000000;

            border:
                2px solid
                #00f2fe;

            box-shadow:
                0 0 30px
                rgba(0, 242, 254, 0.8);

            cursor: pointer;

            animation:
                pulseGlow 2s infinite;
        }


        .btn-go-main.active:hover {

            transform:
                translateY(-2px)
                scale(1.01);

            box-shadow:
                0 0 45px
                rgba(0, 242, 254, 1);
        }


        .btn-go-main.active:active {

            transform:
                translateY(1px)
                scale(0.99);
        }


        @keyframes pulseGlow {

            0% {

                box-shadow:
                    0 0 20px
                    rgba(0, 242, 254, 0.6);
            }

            50% {

                box-shadow:
                    0 0 35px
                    rgba(0, 242, 254, 0.9);
            }

            100% {

                box-shadow:
                    0 0 20px
                    rgba(0, 242, 254, 0.6);
            }

        }


        /* ===============================
           MOBILE
        =============================== */

        @media (max-width: 480px) {

            .app-container {

                padding:
                    30px 20px;

                border-radius: 16px;
            }

            h2 {

                font-size: 22px;
            }

            .btn-submit {

                padding: 13px;
            }

            .btn-go-main {

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <h2>
        MULTIVERSE GATE
    </h2>


    <form id="secureForm">


        <!-- EMAIL -->

        <div class="form-group">

            <label for="emailInput">

                SECURITY EMAIL
                (อีเมลเข้าใช้งาน)

            </label>


            <input
                type="email"
                id="emailInput"
                required
                autocomplete="email"
                placeholder="name@domain.com"
            >

        </div>


        <!-- PIN -->

        <div class="form-group">

            <label for="pinInput">

                ACCESS PIN
                (รหัสตัวเลข 6 หลัก)

            </label>


            <input
                type="text"
                id="pinInput"
                required
                inputmode="numeric"
                autocomplete="off"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="••••••"
            >

        </div>


        <!-- SUBMIT -->

        <button
            type="submit"
            class="btn-submit"
            id="submitButton"
        >

            VERIFY & REGISTER

        </button>


    </form>


    <!-- STATUS -->

    <div
        id="statusMessage"
        class="status-msg"
        aria-live="polite"
    ></div>


    <!-- MAIN WEBSITE BUTTON -->

    <div
        id="secureGate"
        class="btn-go-main"
    >

        🔒 รอการยืนยันสิทธิ์จากระบบ...

    </div>


</div>


<script>


/* =====================================================
   URL เว็บหลัก
   =====================================================

   ตรงนี้คือเว็บที่จะเปิดหลังสมัครสมาชิก

   ไม่ต้องใช้ atob()
   ไม่ต้องใช้ Base64

===================================================== */

const MAIN_URL =
    "https://ai8639647g-cell.github.io/ASFGHJK/";


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById(
        "secureForm"
    );


const emailInput =
    document.getElementById(
        "emailInput"
    );


const pinInput =
    document.getElementById(
        "pinInput"
    );


const submitButton =
    document.getElementById(
        "submitButton"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const secureGate =
    document.getElementById(
        "secureGate"
    );


/* =====================================================
   OPEN MAIN WEBSITE
===================================================== */

function openMainWebsite() {

    console.log(
        "กำลังเปิดเว็บหลัก:",
        MAIN_URL
    );


    if (
        !MAIN_URL ||
        MAIN_URL === "#"
    ) {

        statusMessage.className =
            "status-msg";

        statusMessage.style.color =
            "#ef4444";

        statusMessage.style.background =
            "rgba(239,68,68,.1)";

        statusMessage.innerText =
            "❌ ไม่พบ URL ของเว็บหลัก";

        return;
    }


    /*
       ใช้ location.href
       เพื่อเปิดหน้าเว็บหลัก
    */

    window.location.href =
        MAIN_URL;
}


/* =====================================================
   PIN FILTER
===================================================== */

pinInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 6);

    }
);


/* =====================================================
   EMAIL NORMALIZE
===================================================== */

emailInput.addEventListener(
    "input",
    function () {

        this.value =
            this.value
                .trim()
                .toLowerCase();

    }
);


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
    "submit",
    function (event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const pinCode =
            pinInput.value
                .trim();


        /* =============================================
           ตรวจสอบ Email
        ============================================= */

        if (
            !emailInput.checkValidity()
        ) {

            statusMessage.className =
                "status-msg";

            statusMessage.style.color =
                "#ef4444";

            statusMessage.style.background =
                "rgba(239,68,68,.1)";

            statusMessage.innerText =
                "❌ กรุณากรอกอีเมลให้ถูกต้อง";

            emailInput.focus();

            return;
        }


        /* =============================================
           ตรวจสอบ PIN
        ============================================= */

        if (
            !/^\d{6}$/.test(pinCode)
        ) {

            statusMessage.className =
                "status-msg";

            statusMessage.style.color =
                "#ef4444";

            statusMessage.style.background =
                "rgba(239,68,68,.1)";

            statusMessage.innerText =
                "❌ PIN ต้องเป็นตัวเลข 6 หลัก";

            pinInput.focus();

            return;
        }


        /* =============================================
           LOADING
        ============================================= */

        statusMessage.className =
            "status-msg loading";

        statusMessage.style.background =
            "";

        statusMessage.innerText =
            "⚡ กำลังประมวลผลข้อมูล...";


        secureGate.classList.remove(
            "active"
        );


        secureGate.innerText =
            "⏳ กำลังตรวจสอบข้อมูล...";


        submitButton.disabled =
            true;


        submitButton.style.opacity =
            "0.6";


        /* =============================================
           DATABASE จำลองด้วย localStorage
        ============================================= */

        setTimeout(
            function () {

                try {


                    /*
                       สร้าง key ของบัญชี
                    */

                    const accountKey =
                        "account_" + email;


                    /*
                       ตรวจสอบบัญชีเดิม
                    */

                    const storedPin =
                        localStorage.getItem(
                            accountKey
                        );


                    /* =================================
                       ผู้ใช้เดิม
                    ================================= */

                    if (
                        storedPin !== null
                    ) {


                        /*
                           PIN ถูกต้อง
                        */

                        if (
                            storedPin === pinCode
                        ) {


                            statusMessage.className =
                                "status-msg";


                            statusMessage.style.color =
                                "#38bdf8";


                            statusMessage.style.background =
                                "rgba(56,189,248,.1)";


                            statusMessage.innerText =
                                "🔑 ยืนยันตัวตนสำเร็จ!";


                            secureGate.classList.add(
                                "active"
                            );


                            secureGate.innerText =
                                "🚀 เข้าสู่เว็บหลัก";


                            /*
                               สำคัญมาก

                               ผูก click ใหม่
                               ทุกครั้งที่ login สำเร็จ
                            */

                            secureGate.onclick =
                                openMainWebsite;


                            submitButton.disabled =
                                false;


                            submitButton.style.opacity =
                                "1";


                        }

                        /*
                           PIN ผิด
                        */

                        else {


                            statusMessage.className =
                                "status-msg";


                            statusMessage.style.color =
                                "#ef4444";


                            statusMessage.style.background =
                                "rgba(239,68,68,.1)";


                            statusMessage.innerText =
                                "❌ PIN ไม่ถูกต้อง";


                            secureGate.classList.remove(
                                "active"
                            );


                            secureGate.innerText =
                                "🔒 การเข้าถึงถูกปฏิเสธ";


                            secureGate.onclick =
                                null;


                            submitButton.disabled =
                                false;


                            submitButton.style.opacity =
                                "1";
                        }


                        return;
                    }


                    /* =================================
                       สมัครสมาชิกใหม่
                    ================================= */


                    localStorage.setItem(
                        accountKey,
                        pinCode
                    );


                    statusMessage.className =
                        "status-msg";


                    statusMessage.style.color =
                        "#00ffcc";


                    statusMessage.style.background =
                        "rgba(0,255,204,.1)";


                    statusMessage.innerText =
                        "✅ สมัครสมาชิกสำเร็จ!";


                    secureGate.classList.add(
                        "active"
                    );


                    secureGate.innerText =
                        "⚡ คลิกที่นี่เพื่อเปิดเว็บหลัก";


                    /*
                       นี่คือส่วนที่แก้ปัญหา

                       เมื่อกดปุ่มสีฟ้า
                       จะเรียก openMainWebsite()
                    */

                    secureGate.onclick =
                        openMainWebsite;


                    submitButton.disabled =
                        false;


                    submitButton.style.opacity =
                        "1";


                }


                catch (error) {


                    console.error(
                        "Registration error:",
                        error
                    );


                    statusMessage.className =
                        "status-msg";


                    statusMessage.style.color =
                        "#ef4444";


                    statusMessage.style.background =
                        "rgba(239,68,68,.1)";


                    statusMessage.innerText =
                        "❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล";


                    secureGate.classList.remove(
                        "active"
                    );


                    secureGate.innerText =
                        "🔒 ระบบไม่สามารถดำเนินการต่อได้";


                    secureGate.onclick =
                        null;


                    submitButton.disabled =
                        false;


                    submitButton.style.opacity =
                        "1";

                }

            },

            1000
        );

    }
);


</script>


</body>
</html>
