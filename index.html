<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ระบบสมัครสมาชิกปลอดภัยสูง</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Noto Sans Thai', 'Segoe UI', sans-serif;
            background:
                radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* Cyber Matrix Grid */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;

            background-image:
                linear-gradient(
                    rgba(56, 189, 248, 0.03) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(56, 189, 248, 0.03) 1px,
                    transparent 1px
                );

            background-size: 30px 30px;
            background-position: center;
            animation: gridMove 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50px);
            }
        }

        /* กล่องหลัก */
        .app-container {
            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.97),
                    rgba(30, 41, 59, 0.97)
                );

            padding: 40px 30px;
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(56, 189, 248, 0.1);

            width: calc(100% - 30px);
            max-width: 440px;

            border: 1px solid rgba(56, 189, 248, 0.2);

            position: relative;
            z-index: 1;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* เส้นแสงด้านบน */
        .app-container::after {
            content: "";

            position: absolute;
            top: 0;
            left: 10%;

            width: 80%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #38bdf8,
                    #00ffcc,
                    transparent
                );

            box-shadow: 0 0 10px #38bdf8;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;

            color: #38bdf8;

            font-family:
                'Orbitron',
                'Noto Sans Thai',
                sans-serif;

            font-weight: 700;
            letter-spacing: 1px;

            text-shadow:
                0 0 10px rgba(56, 189, 248, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #94a3b8;

            font-size: 13px;
            font-weight: 500;

            letter-spacing: 0.5px;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            background-color: rgba(2, 6, 23, 0.7);

            border: 1px solid #334155;
            border-radius: 10px;

            color: #ffffff;

            font-size: 15px;
            font-family: inherit;

            outline: none;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            border-color: #38bdf8;

            box-shadow:
                0 0 15px rgba(56, 189, 248, 0.25);

            background-color: rgba(2, 6, 23, 0.9);
        }

        /* PIN */
        #pinInput {
            font-family: 'Orbitron', monospace;
            letter-spacing: 4px;
        }

        /* ปุ่มสมัคร */
        .btn-submit {
            width: 100%;

            padding: 14px;

            background:
                linear-gradient(
                    135deg,
                    #3b82f6 0%,
                    #1d4ed8 100%
                );

            color: white;

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-family: inherit;

            cursor: pointer;

            font-weight: bold;

            margin-top: 10px;

            box-shadow:
                0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);

            box-shadow:
                0 6px 20px rgba(59, 130, 246, 0.5);

            background:
                linear-gradient(
                    135deg,
                    #2563eb 0%,
                    #1e40af 100%
                );
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* ข้อความสถานะ */
        .status-msg {
            text-align: center;

            margin: 20px 0;

            font-size: 14px;

            min-height: 24px;

            font-weight: bold;

            padding: 8px;

            border-radius: 6px;
        }

        .status-msg.loading {
            color: #f59e0b;

            background: rgba(245, 158, 11, 0.1);

            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        /* ประตูระบบ */
        .btn-go-main {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            padding: 16px;

            background-color: #0f172a;

            color: #475569;

            text-align: center;

            border-radius: 10px;

            font-size: 15px;
            font-weight: bold;

            border: 2px dashed #334155;

            cursor: not-allowed;
        }

        /* เมื่อปลดล็อก */
        .btn-go-main.active {
            background:
                linear-gradient(
                    135deg,
                    #00f2fe 0%,
                    #4facfe 100%
                );

            color: #000000;

            border: 2px solid #00f2fe;

            box-shadow:
                0 0 30px rgba(0, 242, 254, 0.8);

            cursor: pointer;

            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow:
                    0 0 20px rgba(0, 242, 254, 0.6);
            }

            50% {
                box-shadow:
                    0 0 35px rgba(0, 242, 254, 0.9);
            }

            100% {
                box-shadow:
                    0 0 20px rgba(0, 242, 254, 0.6);
            }
        }

        /* มือถือ */
        @media (max-width: 480px) {
            .app-container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            h2 {
                font-size: 22px;
            }

            .btn-submit {
                padding: 13px;
            }

            .btn-go-main {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <h2>MULTIVERSE GATE</h2>

        <form id="secureForm">

            <div class="form-group">

                <label for="emailInput">
                    SECURITY EMAIL (อีเมลเข้าใช้งาน)
                </label>

                <input
                    type="email"
                    id="emailInput"
                    required
                    autocomplete="email"
                    placeholder="name@domain.com"
                >

            </div>

            <div class="form-group">

                <label for="pinInput">
                    ACCESS PIN (รหัสตัวเลข 6 หลัก)
                </label>

                <input
                    type="text"
                    id="pinInput"
                    required
                    inputmode="numeric"
                    autocomplete="off"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="••••••"
                >

            </div>

            <button
                type="submit"
                class="btn-submit"
                id="submitButton"
            >
                VERIFY & REGISTER
            </button>

        </form>

        <div
            id="statusMessage"
            class="status-msg"
            aria-live="polite"
        ></div>

        <div
            id="secureGate"
            class="btn-go-main"
        >
            🔒 รอการยืนยันสิทธิ์จากระบบฐานข้อมูล...
        </div>

    </div>

    <script>

        /* ==========================================
           TARGET URL
           ========================================== */

        /*
         * Base64 ของ:
         * https://ai8639647g-cell.github.io/ASFGHJK/
         */

        const _secretData =
            "https://ai8639647g-cell.github.io/ASFGHJK/";


        function getSecureTarget() {

            try {
                return atob(_secretData);
            } catch (error) {

                console.error(
                    "ไม่สามารถถอดรหัส URL ได้:",
                    error
                );

                return "#";
            }
        }


        /* ==========================================
           ELEMENTS
           ========================================== */

        const form =
            document.getElementById("secureForm");

        const emailInput =
            document.getElementById("emailInput");

        const pinInput =
            document.getElementById("pinInput");

        const submitButton =
            document.getElementById("submitButton");

        const statusMessage =
            document.getElementById("statusMessage");

        const secureGate =
            document.getElementById("secureGate");


        /* ==========================================
           PIN FILTER
           ========================================== */

        pinInput.addEventListener("input", function () {

            /* อนุญาตเฉพาะตัวเลข */
            this.value = this.value
                .replace(/\D/g, "")
                .slice(0, 6);

        });


        /* ==========================================
           EMAIL NORMALIZE
           ========================================== */

        emailInput.addEventListener("input", function () {

            this.value = this.value.trim().toLowerCase();

        });


        /* ==========================================
           DISABLE RIGHT CLICK
           ========================================== */

        document.addEventListener(
            "contextmenu",
            function (event) {
                event.preventDefault();
            }
        );


        /* ==========================================
           BASIC DEVTOOLS BLOCK
           ========================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "F12" ||

                    (event.ctrlKey &&
                        event.shiftKey &&
                        (
                            event.key === "I" ||
                            event.key === "J"
                        )) ||

                    (event.ctrlKey &&
                        event.key === "U")
                ) {

                    event.preventDefault();

                }

            }
        );


        /* ==========================================
           FORM SUBMIT
           ========================================== */

        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim().toLowerCase();

                const pinCode =
                    pinInput.value.trim();


                /* ตรวจสอบอีเมล */
                if (!emailInput.checkValidity()) {

                    statusMessage.className =
                        "status-msg";

                    statusMessage.style.color =
                        "#ef4444";

                    statusMessage.style.background =
                        "rgba(239, 68, 68, 0.1)";

                    statusMessage.innerText =
                        "❌ กรุณากรอกอีเมลให้ถูกต้อง";

                    emailInput.focus();

                    return;
                }


                /* ตรวจสอบ PIN */
                if (!/^\d{6}$/.test(pinCode)) {

                    statusMessage.className =
                        "status-msg";

                    statusMessage.style.color =
                        "#ef4444";

                    statusMessage.style.background =
                        "rgba(239, 68, 68, 0.1)";

                    statusMessage.innerText =
                        "❌ ปฏิเสธการเข้าถึง: PIN ต้องเป็นตัวเลข 6 หลัก";

                    pinInput.focus();

                    return;
                }


                /* Loading */
                statusMessage.className =
                    "status-msg loading";

                statusMessage.style.background =
                    "";

                statusMessage.innerText =
                    "⚡ กำลังประมวลผลผ่าน Matrix Decoder...";

                secureGate.classList.remove("active");

                secureGate.innerText =
                    "⏳ กำลังจับคู่รหัสลับในระบบ...";

                submitButton.disabled = true;

                submitButton.style.opacity = "0.6";


                /* จำลองการประมวลผล */
                setTimeout(
                    function () {

                        try {

                            const storedPin =
                                localStorage.getItem(
                                    "account_" + email
                                );


                            /* =================================
                               ผู้ใช้เดิม
                               ================================= */

                            if (storedPin !== null) {

                                if (storedPin === pinCode) {

                                    statusMessage.className =
                                        "status-msg";

                                    statusMessage.style.color =
                                        "#38bdf8";

                                    statusMessage.style.background =
                                        "rgba(56, 189, 248, 0.1)";

                                    statusMessage.innerText =
                                        "🔑 ยืนยันตัวตนสำเร็จ! กำลังนำทางไปเว็บหลัก...";


                                    secureGate.classList.add(
                                        "active"
                                    );

                                    secureGate.innerText =
                                        "🚀 กำลังเข้าสู่ระบบอัตโนมัติ";


                                    setTimeout(
                                        function () {

                                            window.location.href =
                                                getSecureTarget();

                                        },
                                        1200
                                    );

                                } else {

                                    statusMessage.className =
                                        "status-msg";

                                    statusMessage.style.color =
                                        "#ef4444";

                                    statusMessage.style.background =
                                        "rgba(239, 68, 68, 0.1)";

                                    statusMessage.innerText =
                                        "❌ PIN ไม่ถูกต้อง";

                                    secureGate.classList.remove(
                                        "active"
                                    );

                                    secureGate.innerText =
                                        "🔒 การเข้าถึงถูกปฏิเสธ";

                                    submitButton.disabled = false;

                                    submitButton.style.opacity =
                                        "1";
                                }

                                return;
                            }


                            /* =================================
                               สมัครสมาชิกใหม่
                               ================================= */

                            localStorage.setItem(
                                "account_" + email,
                                pinCode
                            );


                            statusMessage.className =
                                "status-msg";

                            statusMessage.style.color =
                                "#00ffcc";

                            statusMessage.style.background =
                                "rgba(0, 255, 204, 0.1)";

                            statusMessage.innerText =
                                "✅ สร้างบัญชีรักษาความปลอดภัยใหม่สำเร็จ!";


                            secureGate.classList.add(
                                "active"
                            );

                            secureGate.innerText =
                                "⚡ คลิกที่นี่เพื่อเปิดประตูมิติ";


                            secureGate.onclick =
                                function () {

                                    const target =
                                        getSecureTarget();

                                    if (target !== "#") {

                                        window.location.href =
                                            target;

                                    }

                                };


                            submitButton.disabled = false;

                            submitButton.style.opacity =
                                "1";

                        } catch (error) {

                            console.error(error);

                            statusMessage.className =
                                "status-msg";

                            statusMessage.style.color =
                                "#ef4444";

                            statusMessage.style.background =
                                "rgba(239, 68, 68, 0.1)";

                            statusMessage.innerText =
                                "❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล";

                            secureGate.classList.remove(
                                "active"
                            );

                            secureGate.innerText =
                                "🔒 ระบบไม่สามารถดำเนินการต่อได้";

                            submitButton.disabled = false;

                            submitButton.style.opacity =
                                "1";
                        }

                    },
                    1000
                );

            }
        );

    </script>

</body>
</html>
