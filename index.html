<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>เข้าสู่ระบบ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
        linear-gradient(
            135deg,
            #020617,
            #172554,
            #2563eb
        );

    color:white;
}

.card{
    width:92%;
    max-width:420px;

    padding:30px;

    border-radius:24px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(20px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.45);
}

.logo{
    text-align:center;
    font-size:44px;
}

h1{
    text-align:center;
    margin:8px 0;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:16px;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:15px;

    border:0;
    outline:0;

    border-radius:12px;

    font-size:16px;
}

.main-button{
    width:100%;

    margin-top:22px;
    padding:15px;

    border:0;
    border-radius:12px;

    background:#22c55e;
    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

.main-button:disabled{
    opacity:.6;
    cursor:wait;
}

.links{
    display:flex;
    gap:10px;

    margin-top:15px;
}

.links button{
    flex:1;

    padding:12px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:10px;

    background:rgba(255,255,255,.08);

    color:white;

    cursor:pointer;
}

.links button:hover{
    background:rgba(255,255,255,.18);
}

#message{
    display:none;

    margin-top:18px;
    padding:12px;

    border-radius:10px;

    text-align:center;

    line-height:1.5;
}

.success{
    display:block !important;
    background:rgba(34,197,94,.18);
    color:#86efac;
}

.error{
    display:block !important;
    background:rgba(239,68,68,.18);
    color:#fca5a5;
}

.info{
    display:block !important;
    background:rgba(59,130,246,.18);
    color:#bfdbfe;
}

.hidden{
    display:none !important;
}

.back{
    width:100%;

    margin-top:15px;
    padding:12px;

    border:0;
    border-radius:10px;

    background:#475569;

    color:white;

    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">🔐</div>

    <h1 id="title">
        เข้าสู่ระบบ
    </h1>

    <div class="subtitle" id="subtitle">
        ใช้อีเมลและรหัสผ่านของคุณ
    </div>


    <!-- ================================
         LOGIN
         ================================ -->

    <form id="loginForm">

        <label>
            อีเมล
        </label>

        <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
        >

        <label>
            รหัสผ่าน
        </label>

        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            placeholder="รหัสผ่าน"
            required
        >

        <button
            class="main-button"
            id="loginButton"
            type="submit"
        >
            เข้าสู่ระบบ
        </button>

    </form>


    <!-- ================================
         REGISTER
         ================================ -->

    <form
        id="registerForm"
        class="hidden"
    >

        <label>
            อีเมล
        </label>

        <input
            id="registerEmail"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
        >

        <label>
            รหัสผ่าน
        </label>

        <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
            placeholder="อย่างน้อย 6 ตัวอักษร"
            minlength="6"
            required
        >

        <label>
            ยืนยันรหัสผ่าน
        </label>

        <input
            id="registerConfirm"
            type="password"
            autocomplete="new-password"
            placeholder="กรอกรหัสผ่านอีกครั้ง"
            minlength="6"
            required
        >

        <button
            class="main-button"
            id="registerButton"
            type="submit"
        >
            สมัครบัญชี
        </button>

    </form>


    <!-- ================================
         RECOVERY
         ================================ -->

    <form
        id="recoveryForm"
        class="hidden"
    >

        <label>
            อีเมลบัญชีของคุณ
        </label>

        <input
            id="recoveryEmail"
            type="email"
            autocomplete="email"
            placeholder="example@email.com"
            required
        >

        <button
            class="main-button"
            id="recoveryButton"
            type="submit"
        >
            ส่งลิงก์กู้คืนรหัสผ่าน
        </button>

    </form>


    <!-- ================================
         LINKS
         ================================ -->

    <div
        class="links"
        id="navigation"
    >

        <button
            type="button"
            onclick="showRegister()"
        >
            สมัครบัญชี
        </button>

        <button
            type="button"
            onclick="showRecovery()"
        >
            กู้คืนรหัสผ่าน
        </button>

    </div>


    <button
        id="backButton"
        class="back hidden"
        type="button"
        onclick="showLogin()"
    >
        ← กลับเข้าสู่ระบบ
    </button>


    <!-- ================================
         MESSAGE
         ================================ -->

    <div id="message"></div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
   ===================================================== */

const SUPABASE_URL =
    "ใส่_SUPABASE_PROJECT_URL_ตรงนี้";

const SUPABASE_PUBLISHABLE_KEY =
    "ใส่_SUPABASE_PUBLISHABLE_KEY_ตรงนี้";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   เว็บหลักของคุณ
   ===================================================== */

const MAIN_WEBSITE =
    "https://ai8639647g-cell.github.io/GGB/";


/* =====================================================
   ELEMENTS
   ===================================================== */

const title =
    document.getElementById("title");

const subtitle =
    document.getElementById("subtitle");

const loginForm =
    document.getElementById("loginForm");

const registerForm =
    document.getElementById("registerForm");

const recoveryForm =
    document.getElementById("recoveryForm");

const navigation =
    document.getElementById("navigation");

const backButton =
    document.getElementById("backButton");

const message =
    document.getElementById("message");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
    text,
    type
){

    message.textContent = text;

    message.className = type;

    message.style.display = "block";
}


function clearMessage(){

    message.textContent = "";

    message.className = "";

    message.style.display = "none";
}


/* =====================================================
   LOGIN PAGE
   ===================================================== */

function showLogin(){

    clearMessage();

    title.textContent =
        "เข้าสู่ระบบ";

    subtitle.textContent =
        "ใช้อีเมลและรหัสผ่านของคุณ";

    loginForm.classList.remove("hidden");

    registerForm.classList.add("hidden");

    recoveryForm.classList.add("hidden");

    navigation.classList.remove("hidden");

    backButton.classList.add("hidden");
}


/* =====================================================
   REGISTER PAGE
   ===================================================== */

function showRegister(){

    clearMessage();

    title.textContent =
        "สมัครบัญชี";

    subtitle.textContent =
        "สร้างบัญชีใหม่ด้วยอีเมลของคุณ";

    loginForm.classList.add("hidden");

    registerForm.classList.remove("hidden");

    recoveryForm.classList.add("hidden");

    navigation.classList.add("hidden");

    backButton.classList.remove("hidden");
}


/* =====================================================
   RECOVERY PAGE
   ===================================================== */

function showRecovery(){

    clearMessage();

    title.textContent =
        "กู้คืนรหัสผ่าน";

    subtitle.textContent =
        "เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้คุณ";

    loginForm.classList.add("hidden");

    registerForm.classList.add("hidden");

    recoveryForm.classList.remove("hidden");

    navigation.classList.add("hidden");

    backButton.classList.remove("hidden");
}


/* =====================================================
   LOGIN
   ===================================================== */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const button =
            document
            .getElementById("loginButton");


        button.disabled = true;

        button.textContent =
            "กำลังตรวจสอบ...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


            if(error){

                throw error;
            }


            if(!data.user){

                throw new Error(
                    "ไม่พบข้อมูลบัญชี"
                );
            }


            /* =========================================
               บันทึกกิจกรรม LOGIN
               ========================================= */

            await supabaseClient
            .from("activity_logs")
            .insert({

                user_id:
                    data.user.id,

                event_type:
                    "login",

                page:
                    "login",

                details:{

                    message:
                        "เข้าสู่ระบบสำเร็จ"

                }

            });


            /* =========================================
               แจ้งเตือนสำเร็จ
               ========================================= */

            showMessage(
                "✅ เข้าสู่ระบบสำเร็จ กำลังเข้าสู่เว็บไซต์...",
                "success"
            );


            /* =========================================
               เด้งเข้าเว็บหลัก
               ========================================= */

            setTimeout(
                function(){

                    window.location.replace(
                        MAIN_WEBSITE
                    );

                },
                500
            );

        }

        catch(error){

            console.error(error);


            showMessage(
                "❌ อีเมลหรือรหัสผ่านไม่ถูกต้อง",
                "error"
            );


            button.disabled = false;

            button.textContent =
                "เข้าสู่ระบบ";
        }

    }
);


/* =====================================================
   REGISTER
   ===================================================== */

registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();


        const email =
            document
            .getElementById("registerEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("registerPassword")
            .value;


        const confirm =
            document
            .getElementById("registerConfirm")
            .value;


        const button =
            document
            .getElementById("registerButton");


        if(password !== confirm){

            showMessage(
                "❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน",
                "error"
            );

            return;
        }


        if(password.length < 6){

            showMessage(
                "❌ รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "กำลังสร้างบัญชี...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email:
                    email,

                password:
                    password

            });


            if(error){

                throw error;
            }


            if(!data.user){

                throw new Error(
                    "สร้างบัญชีไม่สำเร็จ"
                );
            }


            /*
             * ถ้ามี session แปลว่าสามารถเข้าใช้งานได้ทันที
             */

            if(data.session){

                await supabaseClient
                .from("activity_logs")
                .insert({

                    user_id:
                        data.user.id,

                    event_type:
                        "register",

                    page:
                        "register",

                    details:{

                        message:
                            "สมัครบัญชีสำเร็จ"

                    }

                });


                showMessage(
                    "✅ สมัครบัญชีสำเร็จ กำลังเข้าสู่เว็บไซต์...",
                    "success"
                );


                setTimeout(
                    function(){

                        window.location.replace(
                            MAIN_WEBSITE
                        );

                    },
                    500
                );

                return;
            }


            /*
             * กรณีเปิด Email Confirmation
             */

            showMessage(
                "✅ สร้างบัญชีแล้ว กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี",
                "success"
            );


            button.disabled = false;

            button.textContent =
                "สมัครบัญชี";

        }

        catch(error){

            console.error(error);


            let text =
                error.message ||
                "เกิดข้อผิดพลาด";


            if(
                text
                .toLowerCase()
                .includes("already")
            ){

                text =
                    "❌ อีเมลนี้มีบัญชีอยู่แล้ว กรุณาเข้าสู่ระบบ";
            }


            showMessage(
                text,
                "error"
            );


            button.disabled = false;

            button.textContent =
                "สมัครบัญชี";
        }

    }
);


/* =====================================================
   PASSWORD RECOVERY
   ===================================================== */

recoveryForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();


        const email =
            document
            .getElementById("recoveryEmail")
            .value
            .trim();


        const button =
            document
            .getElementById("recoveryButton");


        button.disabled = true;

        button.textContent =
            "กำลังส่ง...";


        try{

            const {
                error
            } =
            await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {

                    redirectTo:
                        window.location.origin +
                        window.location.pathname +
                        "?reset=1"

                }
            );


            if(error){

                throw error;
            }


            showMessage(
                "📧 ส่งลิงก์กู้คืนไปที่อีเมลแล้ว กรุณาตรวจสอบกล่องจดหมาย",
                "success"
            );


            button.disabled = false;

            button.textContent =
                "ส่งลิงก์กู้คืนรหัสผ่าน";

        }

        catch(error){

            console.error(error);


            showMessage(
                "❌ ไม่สามารถส่งลิงก์กู้คืนได้: " +
                error.message,
                "error"
            );


            button.disabled = false;

            button.textContent =
                "ส่งลิงก์กู้คืนรหัสผ่าน";
        }

    }
);


/* =====================================================
   ตรวจสอบว่ากำลังกลับมาจาก RESET PASSWORD หรือไม่
   ===================================================== */

if(
    window.location.search
    .includes("reset=1")
){

    showMessage(
        "🔐 เปิดลิงก์จากอีเมลแล้ว คุณสามารถตั้งรหัสผ่านใหม่ได้ในขั้นตอนถัดไป",
        "info"
    );
}


/* =====================================================
   เริ่มต้นด้วยหน้า LOGIN
   ===================================================== */

showLogin();

</script>

</body>
</html>
