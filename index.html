<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสมัครอีเมลและเข้าสู่ระบบ Quantum Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .app-container {
            background-color: #161f32;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            border: 1px solid #233554;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #4facfe;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a0aec0;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background-color: #2563eb;
        }
        .status-msg {
            text-align: center;
            margin: 15px 0;
            font-size: 14px;
            min-height: 20px;
            font-weight: bold;
        }
        /* ปุ่มสีเขียวสำหรับเด้งเข้าเว็บหลักของคุณ */
        .btn-go-main {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1e293b; /* ตอนแรกเป็นสีมืดๆ */
            color: #64748b;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            border: 2px solid #334155;
            pointer-events: none; /* ล็อกไม่ให้กดคลิก */
            transition: all 0.4s ease;
        }
        /* คลาสที่จะถูกใส่เพิ่มหลังจากสมัคร/กู้คืนเสร็จแล้ว */
        .btn-go-main.active {
            background-color: #00ffcc; /* เปลี่ยนเป็นสีเขียวนีออน */
            color: #000000;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
            pointer-events: auto; /* ปลดล็อกให้กดคลิกได้ */
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h2>สมัครอีเมล / กู้คืนข้อมูล</h2>
    
    <form id="emailForm">
        <div class="form-group">
            <label for="emailInput">กรอกอีเมลของคุณ:</label>
            <input type="email" id="emailInput" required placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label for="passwordInput">ตั้งรหัสผ่าน / บันทึกข้อมูล:</label>
            <input type="text" id="passwordInput" required placeholder="กรอกข้อมูลหรือรหัสผ่าน">
        </div>
        <button type="submit" class="btn-submit">สมัครและบันทึกข้อมูล</button>
    </form>

    <div id="statusMessage" class="status-msg"></div>

    <!-- ปุ่มลิงก์สีเขียวที่จะเด้งไปเว็บคุณ จะคลิกได้ต่อเมื่อสมัครเสร็จ -->
    <a id="mainWebLink" href="https://ai8639647g-cell.github.io/GGB/?utm_source=chatgpt.com" class="btn-go-main">
        🚀 เข้าสู่หน้าเว็บหลักของคุณ
    </a>
</div>

<script>
    document.getElementById('emailForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();
        const statusMessage = document.getElementById('statusMessage');
        const mainWebLink = document.getElementById('mainWebLink');

        // ตรวจสอบว่าเคยสมัครอีเมลนี้ไว้ในระบบแล้วหรือยัง
        const existingData = localStorage.getItem(email);

        if (existingData) {
            // กรณีเคยสมัครแล้ว -> ทำการกู้คืนข้อมูลเก่าออกมาโชว์ให้เห็น
            document.getElementById('passwordInput').value = existingData;
            statusMessage.style.color = '#38bdf8';
            statusMessage.innerText = "พบอีเมลเก่าในระบบ! กู้คืนข้อมูลเดิมเรียบร้อยแล้ว";
        } else {
            // กรณีเป็นอีเมลใหม่ -> บันทึกข้อมูลลงฐานข้อมูลเบื้องต้น
            localStorage.setItem(email, password);
            statusMessage.style.color = '#4ade80';
            statusMessage.innerText = "สมัครและบันทึกข้อมูลเรียบร้อยแล้ว!";
        }

        // ปลดล็อกปุ่มสีเขียว และทำให้เรืองแสงขึ้นมาเพื่อให้กดเชื่อมต่อไปเว็บหลักของคุณได้ทันที
        mainWebLink.classList.add('active');
    });
</script>

</body>
</html>
